<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Deltachem</title>
  <link rel="icon" href="/wp-content/uploads/2024/10/site-icon-150x150.png" sizes="32x32" />
  <link rel="icon" href="/wp-content/uploads/2024/10/site-icon.png" sizes="192x192" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00973B;
      --primary-dark: #007a2f;
      --text: #1e293b;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      background: var(--card-bg);
      padding: 48px 36px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }
    .logo {
      max-width: 200px;
      height: auto;
      margin-bottom: 28px;
    }
    .error-code {
      font-size: 72px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
    }
    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background-color: #f1f5f9;
    }
  </style>
  <link rel='stylesheet' id='deltachem-global-animations-css' href='/wp-content/uploads/global-animations/animations.css?v=1' media='all' />
</head>
<body>
  <div class="container">
    <a href="/">
      <img src="/wp-content/Main-logo-Deltachem-2048x872.png" alt="Deltachem" class="logo" />
    </a>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary">Return to Home</a>
      <a href="/products/" class="btn btn-secondary">Browse Products</a>
    </div>
  </div>
  <script src="/wp-content/uploads/global-animations/animations.js?v=1" defer></script>
</body>
</html>
